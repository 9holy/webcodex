name: Native macOS ARM64 capacity probe
run-name: Native ARM64 capacity probe ${{ inputs.source_sha }}
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source identity (diagnostic only)
        required: true
        type: string
permissions:
  contents: read
jobs:
  capacity-probe:
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Verify native architecture and tool availability only
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(uname -m)" = arm64
          sw_vers
          xcrun --show-sdk-version
          codesign --version
          echo "Native ARM64 diagnostic only; no release acceptance or publication."

name: Diagnose native fixed-input unit tests
on:
  push:
    branches: [diagnostic/pinned-ci-unit-failures]
permissions:
  contents: read
jobs:
  windows:
    if: >-
      github.event_name == 'push' &&
      github.repository_id == '1404596174' &&
      github.actor == '9holy' && github.actor_id == '45361924' &&
      github.triggering_actor == '9holy'
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Observe the unchanged controlled unit fixtures on Windows
        shell: python
        run: |
          import hashlib
          import os
          from pathlib import Path
          import sys
          import unittest
          root = Path(os.environ['GITHUB_WORKSPACE'])
          sys.path.insert(0, str(root))
          pins = {
              'scripts/download_pinned_ci_input.py': 'd6c36dde1ea844672570dd3cc8f4fcc437a84029c0a66fc78e5ec9ba3511437e',
              'scripts/tests/test_download_pinned_ci_input.py': 'fc902e6bd5fe7b615d8e0c6d4dad11e2e2103793a6ab294057f2ae206945bc25',
              'scripts/prepare_tauri_nsis_ci_tools.py': '7b3b760e8bcc45acf8a0468172410a0806abe96c19459b792421c5d24a8203ed',
              'scripts/tests/test_prepare_tauri_nsis_ci_tools.py': 'b87a7045618d96843fb3f09adc97b1c587ae560be36616d11c968ef0e34a6355',
          }
          for name, expected in pins.items():
              if hashlib.sha256((root / name).read_bytes()).hexdigest() != expected:
                  raise SystemExit('Implementation digest mismatch')
          suite = unittest.defaultTestLoader.loadTestsFromNames([
              'scripts.tests.test_download_pinned_ci_input',
              'scripts.tests.test_prepare_tauri_nsis_ci_tools',
          ])
          result = unittest.TextTestRunner(stream=sys.stdout, verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() and result.testsRun == 42 and not result.skipped else 1)

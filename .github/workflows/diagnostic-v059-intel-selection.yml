name: Diagnose Intel selection mirror cost
on:
  push:
    branches: [diagnostic/v059-intel-selection]
permissions:
  contents: read
jobs:
  original-candidate-original:
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - name: Checkout diagnostic control and patch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: control
          persist-credentials: false
      - name: Checkout immutable release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: b0790ddef47b96048d2a2b7992d18fbf5a118217
          path: source
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.2
      - name: Fence source, patch scope and runtime
        shell: bash
        run: |
          test "$(node --version)" = v22.23.2
          test "$(git -C source rev-parse HEAD)" = b0790ddef47b96048d2a2b7992d18fbf5a118217
          mkdir -p "$RUNNER_TEMP/intel-selection"
          patch="$GITHUB_WORKSPACE/control/.github/diagnostics/selection-motion-candidate.patch"
          test -f "$patch"
          test "$(shasum -a 256 "$patch" | cut -d' ' -f1)" = 366b1766bad4e7d83d100b71cd450029b45c845986e36d3359fd21e1c4106ffd
          git -C source apply --check "$patch"
          git -C source apply --numstat "$patch" | tee "$RUNNER_TEMP/intel-selection/patch-scope.txt"
          test "$(git -C source apply --numstat "$patch" | cut -f3 | sort)" = "$(printf '%s\n' frontend/src/ui/selectionMotion.ts frontend/test-v2/selection-motion.test.tsx | sort)"
          { git -C source rev-parse HEAD; git -C control rev-parse HEAD; shasum -a 256 "$patch"; node --version; npm --version; uname -a; sw_vers; sysctl hw.ncpu hw.memsize; } | tee "$RUNNER_TEMP/intel-selection/identity.txt"
          cp "$patch" "$RUNNER_TEMP/intel-selection/candidate.patch"
      - name: Install exact source dependencies once
        working-directory: source
        run: npm ci --prefix frontend && npm ci --prefix apps/desktop
      - name: Original full Desktop suite
        id: original_before
        continue-on-error: true
        working-directory: source/apps/desktop
        shell: bash
        run: |
          test "$(node --version)" = v22.23.2
          set +e
          node node_modules/vitest/vitest.mjs run  --reporter=verbose --reporter=json --outputFile.json="$RUNNER_TEMP/intel-selection/original_before.json" 2>&1 | tee "$RUNNER_TEMP/intel-selection/original_before.log"
          result=${PIPESTATUS[0]}
          echo "$result" > "$RUNNER_TEMP/intel-selection/original_before-exit.txt"
          exit "$result"
      - name: Apply scoped candidate
        working-directory: source
        shell: bash
        run: |
          git diff --exit-code
          git apply "$GITHUB_WORKSPACE/control/.github/diagnostics/selection-motion-candidate.patch"
          git diff --check
          git diff --stat | tee "$RUNNER_TEMP/intel-selection/candidate-stat.txt"
          # Recompile source with identical packages, without reusing transform caches.
          rm -rf apps/desktop/node_modules/.vite apps/desktop/node_modules/.vite-temp
      - name: Candidate full Desktop suite
        id: candidate_desktop
        continue-on-error: true
        working-directory: source/apps/desktop
        shell: bash
        run: |
          test "$(node --version)" = v22.23.2
          set +e
          node node_modules/vitest/vitest.mjs run  --reporter=verbose --reporter=json --outputFile.json="$RUNNER_TEMP/intel-selection/candidate_desktop.json" 2>&1 | tee "$RUNNER_TEMP/intel-selection/candidate_desktop.log"
          result=${PIPESTATUS[0]}
          echo "$result" > "$RUNNER_TEMP/intel-selection/candidate_desktop-exit.txt"
          exit "$result"
      - name: Candidate geometry and reveal regression
        id: candidate_geometry
        continue-on-error: true
        working-directory: source/frontend
        shell: bash
        run: |
          test "$(node --version)" = v22.23.2
          set +e
          node node_modules/vitest/vitest.mjs run --config vitest.config.ts test-v2/selection-motion.test.tsx --reporter=verbose --reporter=json --outputFile.json="$RUNNER_TEMP/intel-selection/candidate_geometry.json" 2>&1 | tee "$RUNNER_TEMP/intel-selection/candidate_geometry.log"
          result=${PIPESTATUS[0]}
          echo "$result" > "$RUNNER_TEMP/intel-selection/candidate_geometry-exit.txt"
          exit "$result"
      - name: Revert candidate for order control
        working-directory: source
        shell: bash
        run: |
          git apply --reverse "$GITHUB_WORKSPACE/control/.github/diagnostics/selection-motion-candidate.patch"
          git diff --exit-code
          rm -rf apps/desktop/node_modules/.vite apps/desktop/node_modules/.vite-temp
      - name: Original full Desktop suite after revert
        id: original_after
        continue-on-error: true
        working-directory: source/apps/desktop
        shell: bash
        run: |
          test "$(node --version)" = v22.23.2
          set +e
          node node_modules/vitest/vitest.mjs run  --reporter=verbose --reporter=json --outputFile.json="$RUNNER_TEMP/intel-selection/original_after.json" 2>&1 | tee "$RUNNER_TEMP/intel-selection/original_after.log"
          result=${PIPESTATUS[0]}
          echo "$result" > "$RUNNER_TEMP/intel-selection/original_after-exit.txt"
          exit "$result"
      - name: Record independent outcomes
        if: always()
        shell: bash
        env:
          ORIGINAL_BEFORE: ${{ steps.original_before.outcome }}
          CANDIDATE_DESKTOP: ${{ steps.candidate_desktop.outcome }}
          CANDIDATE_GEOMETRY: ${{ steps.candidate_geometry.outcome }}
          ORIGINAL_AFTER: ${{ steps.original_after.outcome }}
        run: |
          mkdir -p "$RUNNER_TEMP/intel-selection"
          printf 'original_before=%s\ncandidate_desktop=%s\ncandidate_geometry=%s\noriginal_after=%s\n' "$ORIGINAL_BEFORE" "$CANDIDATE_DESKTOP" "$CANDIDATE_GEOMETRY" "$ORIGINAL_AFTER" | tee "$RUNNER_TEMP/intel-selection/outcomes.txt" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload evidence even when tests failed
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: intel-selection-original-candidate-original
          path: ${{ runner.temp }}/intel-selection/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve every baseline and candidate failure
        if: always()
        env:
          ORIGINAL_BEFORE: ${{ steps.original_before.outcome }}
          CANDIDATE_DESKTOP: ${{ steps.candidate_desktop.outcome }}
          CANDIDATE_GEOMETRY: ${{ steps.candidate_geometry.outcome }}
          ORIGINAL_AFTER: ${{ steps.original_after.outcome }}
        run: test "$ORIGINAL_BEFORE" = success && test "$CANDIDATE_DESKTOP" = success && test "$CANDIDATE_GEOMETRY" = success && test "$ORIGINAL_AFTER" = success

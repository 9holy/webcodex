name: Windows security restore observation

on:
  push:
    branches: ['diagnostic/windows-security-restore']
    paths:
      - '.github/workflows/windows-security-restore-observation.yml'
      - 'crates/webcodex-environment/**'

permissions:
  contents: read

jobs:
  original-security:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: windows-core-ci
      - name: Verify file creation with the exact original security descriptor
        shell: pwsh
        run: |
          cargo test --locked -p webcodex-environment --lib upgrade::windows_installation::security::tests::native_file_creation_with_original_security_keeps_snapshot -- --exact --nocapture
          if ($LASTEXITCODE -ne 0) { throw "Native file creation did not preserve the exact original security descriptor" }

      - name: Promote the same Windows Release while preserving all-platform latest
        run: >-
          python3 scripts/release_github_actions_v058.py promote --request "$CONTROL_REQUEST" --source-root "$SOURCE_ROOT" --state-dir "$STATE_DIR" --bundle-dir "$BUNDLE_DIR"
      - name: Retain stable-promoted

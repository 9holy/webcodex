          if-no-files-found: error
          retention-days: 90
      - name: Require Windows public bytes and preserved all-platform latest
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 7200))
          while true; do
            code=0
            python3 scripts/release_github_actions_v058.py status-post --request "$CONTROL_REQUEST" --source-root "$SOURCE_ROOT" --state-dir "$STATE_DIR" --bundle-dir "$BUNDLE_DIR" --wait-secs 0 || code=$?
            if [ "$code" -eq 0 ]; then break; fi

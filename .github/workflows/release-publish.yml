name: Publish approved GitHub release

run-name: Recover and publish WebCodex v0.5.2

on:
  push:
    branches: [main]
    paths:
      - .github/release-requests/v0.5.2.json
      - .github/release-requests/v0.5.2-assembly-recovery.json
  workflow_dispatch:

# The fixed request and reviewed recovery origin authorize only this release.
# Native outputs stay bound to the original failed-assembly run and immutable tag.
# Candidate workflows retain their existing read-only permissions. Publication
# uses the repository-scoped Actions installation token; no personal token or npm.
permissions:
  contents: read

concurrency:
  group: publish-approved-github-v0.5.2
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == '9holy/webcodex' &&
      github.repository_id == '1404596174' &&
      github.ref == 'refs/heads/main' &&
      github.actor == '9holy' && github.triggering_actor == '9holy'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
      actions: write
    defaults:
      run:
        shell: bash
        working-directory: control
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONDONTWRITEBYTECODE: '1'
      CONTROL_REQUEST: ${{ github.workspace }}/control/.github/release-requests/v0.5.2.json
      SOURCE_ROOT: ${{ github.workspace }}/release-source
    steps:
      - name: Checkout reviewed publication controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 1
          persist-credentials: false
      - name: Initialize publication directories
        run: |
          printf 'STATE_DIR=%s/webcodex-release-control\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'BUNDLE_DIR=%s/webcodex-release-bundle\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Checkout immutable release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 2299ffe5bcc0f3965e11b753fabc3fb558769de8
          path: release-source
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate publication controller contracts
        run: >-
          python3 -m unittest scripts.tests.test_release_github_actions
          scripts.tests.test_release_assembly_publication
          scripts.tests.test_recover_release_assembly
          scripts.tests.test_release_checksum_layout
      - name: Restore this recovery run's verified checkpoint on retry
        run: >-
          python3 scripts/release_assembly_publication.py restore-state --request "$CONTROL_REQUEST" --source-root "$SOURCE_ROOT" --state-dir "$STATE_DIR" --bundle-dir "$BUNDLE_DIR"
      - name: Verify the fixed original publication and immutable tag
        run: >-
          python3 scripts/release_assembly_publication.py preflight-recovery --request "$CONTROL_REQUEST" --source-root "$SOURCE_ROOT" --state-dir "$STATE_DIR" --bundle-dir "$BUNDLE_DIR"
      - name: Retain recovery-preflight
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-control-v0.5.2-${{ github.run_id }}-${{ github.run_attempt }}-01-recovery-preflight
          path: ${{ runner.temp }}/webcodex-release-control/*.json
          if-no-files-found: error
          retention-days: 90
      - name: Recover and fully verify the original native installer bytes
        run: >-
          python3 scripts/release_assembly_publication.py recover-assembly --request "$CONTROL_REQUEST" --source-root "$SOURCE_ROOT" --state-dir "$STATE_DIR" --bundle-dir "$BUNDLE_DIR"
      - name: Retain assembly-recovered
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-control-v0.5.2-${{ github.run_id }}-${{ github.run_attempt }}-10-assembly-recovered
          path: ${{ runner.temp }}/webcodex-release-control/*.json
          if-no-files-found: error
          retention-days: 90
      - name: Prepare the bound draft Release
        run: >-
          python3 scripts/release_assembly_publication.py prepare-draft --request "$CONTROL_REQUEST" --source-root "$SOURCE_ROOT" --state-dir "$STATE_DIR" --bundle-dir "$BUNDLE_DIR"
      - name: Retain draft-intent
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-control-v0.5.2-${{ github.run_id }}-${{ github.run_attempt }}-11-draft-intent
          path: ${{ runner.temp }}/webcodex-release-control/*.json
          if-no-files-found: error
          retention-days: 90
      - name: Create or reconcile the bound draft
        run: >-
          python3 scripts/release_assembly_publication.py create-draft --request "$CONTROL_REQUEST" --source-root "$SOURCE_ROOT" --state-dir "$STATE_DIR" --bundle-dir "$BUNDLE_DIR"
      - name: Retain draft-created
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-control-v0.5.2-${{ github.run_id }}-${{ github.run_attempt }}-12-draft-created
          path: ${{ runner.temp }}/webcodex-release-control/*.json
          if-no-files-found: error
          retention-days: 90
      - name: Freeze the exact public asset list and hashes
        run: >-
          python3 scripts/release_assembly_publication.py prepare-upload --request "$CONTROL_REQUEST" --source-root "$SOURCE_ROOT" --state-dir "$STATE_DIR" --bundle-dir "$BUNDLE_DIR"
      - name: Retain upload-intent
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-control-v0.5.2-${{ github.run_id }}-${{ github.run_attempt }}-13-upload-intent
          path: ${{ runner.temp }}/webcodex-release-control/*.json
          if-no-files-found: error
          retention-days: 90
      - name: Upload retained assets without replacing existing bytes
        run: >-
          python3 scripts/release_assembly_publication.py upload-assets --request "$CONTROL_REQUEST" --source-root "$SOURCE_ROOT" --state-dir "$STATE_DIR" --bundle-dir "$BUNDLE_DIR"
      - name: Retain assets-uploaded
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-control-v0.5.2-${{ github.run_id }}-${{ github.run_attempt }}-14-assets-uploaded
          path: ${{ runner.temp }}/webcodex-release-control/*.json
          if-no-files-found: error
          retention-days: 90
      - name: Verify every draft asset digest and size
        run: >-
          python3 scripts/release_assembly_publication.py verify-draft --request "$CONTROL_REQUEST" --source-root "$SOURCE_ROOT" --state-dir "$STATE_DIR" --bundle-dir "$BUNDLE_DIR"
      - name: Retain draft-verified
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-control-v0.5.2-${{ github.run_id }}-${{ github.run_attempt }}-15-draft-verified
          path: ${{ runner.temp }}/webcodex-release-control/*.json
          if-no-files-found: error
          retention-days: 90
      - name: Prepare publication of the verified draft
        run: >-
          python3 scripts/release_assembly_publication.py prepare-publish --request "$CONTROL_REQUEST" --source-root "$SOURCE_ROOT" --state-dir "$STATE_DIR" --bundle-dir "$BUNDLE_DIR"
      - name: Retain publication-intent
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-control-v0.5.2-${{ github.run_id }}-${{ github.run_attempt }}-16-publication-intent
          path: ${{ runner.temp }}/webcodex-release-control/*.json
          if-no-files-found: error
          retention-days: 90
      - name: Publish the verified GitHub Release once
        run: >-
          python3 scripts/release_assembly_publication.py publish --request "$CONTROL_REQUEST" --source-root "$SOURCE_ROOT" --state-dir "$STATE_DIR" --bundle-dir "$BUNDLE_DIR"
      - name: Retain release-published
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-control-v0.5.2-${{ github.run_id }}-${{ github.run_attempt }}-17-release-published
          path: ${{ runner.temp }}/webcodex-release-control/*.json
          if-no-files-found: error
          retention-days: 90
      - name: Verify the downloadable public installer bytes
        run: >-
          python3 scripts/release_assembly_publication.py verify-public --request "$CONTROL_REQUEST" --source-root "$SOURCE_ROOT" --state-dir "$STATE_DIR" --bundle-dir "$BUNDLE_DIR"
      - name: Retain public-verified
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-control-v0.5.2-${{ github.run_id }}-${{ github.run_attempt }}-18-public-verified
          path: ${{ runner.temp }}/webcodex-release-control/*.json
          if-no-files-found: error
          retention-days: 90
      - name: Prepare explicit image and Intel Desktop dispatches
        run: >-
          python3 scripts/release_assembly_publication.py prepare-post --request "$CONTROL_REQUEST" --source-root "$SOURCE_ROOT" --state-dir "$STATE_DIR" --bundle-dir "$BUNDLE_DIR"
      - name: Retain post-intent
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-control-v0.5.2-${{ github.run_id }}-${{ github.run_attempt }}-19-post-intent
          path: ${{ runner.temp }}/webcodex-release-control/*.json
          if-no-files-found: error
          retention-days: 90
      - name: Dispatch the existing post-publication workflows
        run: >-
          python3 scripts/release_assembly_publication.py dispatch-post --request "$CONTROL_REQUEST" --source-root "$SOURCE_ROOT" --state-dir "$STATE_DIR" --bundle-dir "$BUNDLE_DIR"
      - name: Retain post-dispatched
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-control-v0.5.2-${{ github.run_id }}-${{ github.run_attempt }}-20-post-dispatched
          path: ${{ runner.temp }}/webcodex-release-control/*.json
          if-no-files-found: error
          retention-days: 90
      - name: Observe the exact post-publication workflow runs
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 7200))
          while true; do
            code=0
            python3 scripts/release_assembly_publication.py status-post --request "$CONTROL_REQUEST" --source-root "$SOURCE_ROOT" --state-dir "$STATE_DIR" --bundle-dir "$BUNDLE_DIR" --wait-secs 0 || code=$?
            if [ "$code" -eq 0 ]; then break; fi
            if [ "$code" -ne 2 ]; then exit "$code"; fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "The bound workflow is still pending; retain its identity and resume this run." >&2
              exit 2
            fi
            sleep 45
          done
      - name: Retain post-verified
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-control-v0.5.2-${{ github.run_id }}-${{ github.run_attempt }}-21-post-verified
          path: ${{ runner.temp }}/webcodex-release-control/*.json
          if-no-files-found: error
          retention-days: 90
      - name: Retain final-state
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-control-v0.5.2-${{ github.run_id }}-${{ github.run_attempt }}-99-final-state
          path: ${{ runner.temp }}/webcodex-release-control/*.json
          if-no-files-found: warn
          retention-days: 90
